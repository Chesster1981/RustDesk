# DCS Norway Windows release — tag builds publish portable installer to GitHub Releases.
name: DCS Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag / asset version (e.g. 1.4.10). Required when not running from a tag ref."
        required: false
        type: string
        default: ""
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - 'dcs-v[0-9]+.[0-9]+.[0-9]+'
      - 'dcs-[0-9]+.[0-9]+.[0-9]+'
      - 'dcs-v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - 'dcs-[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              echo "::error::Set workflow_dispatch input release_tag (e.g. 1.4.10), or push a version tag."
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag/version=${TAG}"

  smoke:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - run: echo "tag=${{ needs.resolve-version.outputs.tag }} version=${{ needs.resolve-version.outputs.version }}"
